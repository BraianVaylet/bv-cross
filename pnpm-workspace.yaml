packages:
  - "server"
  - "client"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
# Excluimos todo nuestro scope del retardo de release: son paquetes propios,
# publicados por nosotros, no necesitan el cutoff anti-supply-chain. El glob
# cubre cualquier versión (evita tener que fijar cada bump).
minimumReleaseAgeExclude:
  - '@medano-ui/*'
# Consume el build local de medano-ui mientras se prueban los cambios.
# Publicá @medano-ui/react a npm y quitá este override para volver al registro.
overrides:
  "@medano-ui/react": "file:../bv-medano-ui/packages/react"
